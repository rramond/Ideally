<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideally</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 32 Q32 8 60 32 Q32 56 4 32Z' fill='%230E0617' stroke='%23C084FC' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23A855F7'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2308020E'/%3E%3Ccircle cx='28' cy='28' r='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<aside class="sidebar">
  <button class="brand" id="brand" data-back title="Back">
    <svg viewBox="0 0 64 44"><path class="b-eye" d="M3 22 Q32 1 61 22 Q32 43 3 22Z" fill="#0E0617" stroke="#C084FC" stroke-width="3"/><circle class="b-iris" cx="32" cy="22" r="9.5" fill="#A855F7"/><circle class="b-pupil" cx="32" cy="22" r="4" fill="#08020E"/><circle cx="29" cy="19" r="2" fill="#fff"/></svg>
    Ideally
  </button>
  <nav class="nav-main">
    <button class="nav-btn active" data-view="notes">
      <svg viewBox="0 0 24 24"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      Notes
    </button>
    <button class="nav-btn" data-view="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Calendar
    </button>
    <button class="nav-btn" data-view="board">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="6" width="8" height="8" rx="1"/><rect x="7" y="14" width="8" height="8" rx="1"/></svg>
      Vision board
    </button>
    <button class="nav-btn" data-view="projects">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><circle cx="17" cy="15" r="3.5"/><circle cx="8.5" cy="19.5" r="2"/></svg>
      Projects
    </button>
    <button class="nav-btn" data-view="timer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      Focus
    </button>
  </nav>
  <!-- shown instead of nav-main while the calendar side panel is active -->
  <nav class="nav-cal">
    <div class="nav-label">Calendar</div>
    <button class="nav-btn" id="cal-new-event">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>
      Events
    </button>
    <button class="nav-btn" id="cal-periods">
      <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M6 7v10M18 7v10"/></svg>
      Periods
    </button>
    <button class="nav-btn" id="cal-blocks">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="6" rx="1.5"/><rect x="4" y="11" width="16" height="4" rx="1.5"/><rect x="4" y="17" width="10" height="4" rx="1.5"/></svg>
      Time Blocks
    </button>
    <button class="nav-btn" id="cal-types">
      <svg viewBox="0 0 24 24"><path d="M3 4h8l10 10-8 8L3 12z"/><circle cx="8" cy="9" r="1.5"/></svg>
      Types
    </button>
  </nav>
  <!-- calendar side panel, Time Blocks mode (3c.2) -->
  <nav class="nav-blocks">
    <div class="nav-label">Time Blocks</div>
    <button class="nav-btn" id="tb-new">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
      New Block
    </button>
    <div class="tb-list" id="tb-list"></div>
  </nav>
  <!-- calendar side panel, Periods mode (3e) -->
  <nav class="nav-periods">
    <div class="nav-label">Periods</div>
    <button class="nav-btn" id="pe-new">
      <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M6 7v10M18 7v10"/><path d="M12 3v4"/></svg>
      New Period
    </button>
    <div class="tb-list" id="pe-list"></div>
  </nav>
  <!-- calendar side panel, Types mode (3h) -->
  <nav class="nav-types">
    <div class="nav-label">Event Types</div>
    <button class="nav-btn" id="ty-new">
      <svg viewBox="0 0 24 24"><path d="M3 4h8l10 10-8 8L3 12z"/><path d="M12 11v4M10 13h4"/></svg>
      New Type
    </button>
    <div class="tb-list" id="ty-list"></div>
  </nav>
  <!-- shown instead of nav-main while a project is open (2c) -->
  <nav class="nav-project">
    <div class="nav-label nav-pj-head"><i class="nav-pj-dot" id="nav-pj-dot"></i><span id="nav-pj-name">Project</span></div>
    <button class="nav-btn" data-sec="board">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="6.5" y="7.5" width="5" height="5" rx=".5"/><path d="M14 9h4M14 12h3M7 16h10"/></svg>
      <span class="pj-rail-label">Board</span><span class="pj-rail-count"></span>
    </button>
    <button class="nav-btn" data-sec="notes">
      <svg viewBox="0 0 24 24"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      <span class="pj-rail-label">Notes</span><span class="pj-rail-count"></span>
    </button>
    <button class="nav-btn" data-sec="timeline">
      <svg viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 5h11l-2 3 2 3H5"/><path d="M5 15h7"/></svg>
      <span class="pj-rail-label">Roadmap</span><span class="pj-rail-count"></span>
    </button>
    <button class="nav-btn" data-sec="files">
      <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 4.7 4.7L10.2 18.7a1.7 1.7 0 0 1-2.4-2.4L15.5 8.6"/></svg>
      <span class="pj-rail-label">Files</span><span class="pj-rail-count"></span>
    </button>
    <button class="danger-link nav-pj-delete" id="nav-pj-delete" type="button">delete project</button>
  </nav>
  <!-- themes (4): opens the themes dropdown -->
  <div class="nav-theme">
    <button class="nav-btn" id="theme-btn" title="Themes">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.8-1.7H17a4 4 0 0 0 4-4c0-4.4-4-8.2-9-8.2z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/><circle cx="17" cy="10.5" r="1"/></svg>
      Themes
    </button>
  </div>
</aside>

<main>

  <!-- ================= NOTES ================= -->
  <section class="view active" id="view-notes">
    <div class="notes-list">
      <div class="panel-head">
        <h2>Notes</h2>
        <button class="icon-btn" id="new-note-btn" title="New note">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="note-items" id="note-items"></div>
    </div>
    <div class="editor" id="editor"></div>
  </section>

  <!-- ================= CALENDAR ================= -->
  <section class="view" id="view-calendar">
    <div class="cal-bar">
      <h2 id="cal-title">Week</h2>
      <div class="cal-nav">
        <!-- how many days are shown, 1–7 (keys 1–7 too) -->
        <div class="cal-days" title="Days shown (keys 1–7)">
          <button class="icon-btn" id="cal-days-less" title="Fewer days">−</button>
          <input id="cal-days-label" value="7 days" maxlength="6" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Days shown, 1 to 7" title="Click and type 1–7">
          <button class="icon-btn" id="cal-days-more" title="More days">+</button>
        </div>
        <button class="ghost-btn" id="cal-today">Today</button>
        <button class="icon-btn" id="cal-prev" title="Previous week">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="icon-btn" id="cal-next" title="Next week">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="week" id="week"></div>
    <!-- 3h: an open event type, instead of the week -->
    <div class="type-view" id="type-view"></div>
  </section>

  <!-- ================= BOARD ================= -->
  <section class="view" id="view-board">
    <div class="board-bar">
      <h2>Vision board</h2>
      <button class="tool-btn" id="add-sticky">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New note
      </button>
      <button class="tool-btn" id="add-title" title="Add a text title">
        <svg viewBox="0 0 24 24"><path d="M5 7V4h14v3"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>
        Title
      </button>
      <button class="tool-btn" id="connect-btn" title="Link two stickies with an arrow">
        <svg viewBox="0 0 24 24"><path d="M5 19L17 7"/><path d="M10 6h7v7"/></svg>
        Connect
      </button>
      <div class="color-pick">
        <button class="swatch" id="color-swatch" title="Sticky color"></button>
      </div>
      <div class="fmt-group off" id="fmt-group">
        <button class="fmt-btn" id="fmt-bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="fmt-btn" id="fmt-italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <div class="fmt-size">
          <button class="fmt-btn" id="fmt-size-down" title="Smaller text">−</button>
          <span class="fmt-size-val" id="fmt-size-val">–</span>
          <button class="fmt-btn" id="fmt-size-up" title="Larger text">+</button>
        </div>
        <div class="color-pick">
          <button class="fmt-btn fmt-color" id="fmt-color" title="Text color">A<span class="fmt-color-bar" id="fmt-color-bar"></span></button>
        </div>
      </div>
      <button class="zoom-pill" id="zoom-pill" title="Reset view">100%</button>
    </div>
    <div class="board-stage" id="board-stage">
      <div class="board-world" id="board-world">
        <svg id="arrow-layer" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrowhead" markerWidth="9" markerHeight="8"
                    refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0.5,0.5 L8,4 L0.5,7.5 Z" fill="#5E5B7A"/>
            </marker>
            <marker id="arrowhead-hot" markerWidth="9" markerHeight="8"
                    refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0.5,0.5 L8,4 L0.5,7.5 Z" fill="#C084FC"/>
            </marker>
          </defs>
          <g id="arrow-paths"></g>
          <g id="arrow-handles"></g>
        </svg>
        <div class="board-floor" id="board-floor"></div>
      </div>
      <div class="board-empty" id="board-empty" style="display:none">
        <span class="be-big">An empty wall.</span>
        <span>Pick a color and add your first sticky.</span>
      </div>
    </div>
  </section>

  <!-- ================= TIMER ================= -->
  <!-- ================= PROJECTS (2) ================= -->
  <section class="view" id="view-projects">
    <canvas id="pj-canvas" aria-label="Projects: each circle is a project; click to open, right-click for more"></canvas>
    <p class="pj-hint" id="pj-hint">Create your first project with the <b>+</b></p>
    <!-- a project, full screen (2c, built by src/projects/projectPage.js) -->
    <div class="pj-page" id="pj-page" hidden></div>
  </section>

  <section class="view" id="view-timer">
    <canvas id="scene-canvas"></canvas>
    <div class="scene-dim"></div>
    <div class="timer-shell">
      <div class="timer-phase" id="timer-phase">Focus</div>
      <div class="t-units">
        <div class="t-unit">
          <button class="t-step" data-step="3600">▲</button>
          <span class="t-num" id="tn-h">1</span>
          <button class="t-step" data-step="-3600">▼</button>
        </div>
        <span class="t-colon">:</span>
        <div class="t-unit">
          <button class="t-step" data-step="300">▲</button>
          <span class="t-num" id="tn-m">00</span>
          <button class="t-step" data-step="-300">▼</button>
        </div>
        <span class="t-colon">:</span>
        <div class="t-unit">
          <button class="t-step hidden">▲</button>
          <span class="t-num" id="tn-s">00</span>
          <button class="t-step hidden">▼</button>
        </div>
      </div>
      <div class="timer-controls">
        <button class="primary-btn big" id="timer-start">Start</button>
        <button class="ghost-btn" id="timer-reset">Reset</button>
      </div>
      <div class="timer-opts">
        <label>Preset
          <select id="preset-sel">
            <option value="custom">Custom</option>
            <option value="pomodoro">Pomodoro · 25 + 5</option>
            <option value="pomodoroL">Long Pomodoro · 50 + 10</option>
            <option value="desktime">DeskTime · 52 + 17</option>
            <option value="ultradian">Ultradian · 90 + 20</option>
          </select>
        </label>
        <label>Scene
          <select id="scene-sel">
            <option value="jungle">Jungle at night</option>
            <option value="space">Orbiting planets</option>
            <option value="blackhole">Black hole</option>
            <option value="ocean">Ocean sunset</option>
          </select>
        </label>
        <label>Sound
          <select id="sound-sel">
            <option value="on">Scene ambience</option>
            <option value="off">Muted</option>
          </select>
        </label>
      </div>
    </div>
  </section>

</main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
